name: Frontend Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  lint-and-typecheck:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        id: lint
        working-directory: frontend
        run: |
          if npm run lint 2>&1 | tee /tmp/lint-output.txt; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "output<<EOF"
              cat /tmp/lint-output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeScript type-check
        id: typecheck
        working-directory: frontend
        run: |
          if npm run type-check 2>&1 | tee /tmp/ts-output.txt; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "output<<EOF"
              cat /tmp/ts-output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check translation key parity
        id: i18n
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- frontend/messages/ || true)
          if [ -z "$CHANGED" ]; then
            echo "No translation files changed — skipping key parity check."
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Translation files changed: $CHANGED"

          MSGS=frontend/messages
          REF="$MSGS/en.json"
          REF_KEYS=$(jq -r '[paths(scalars)] | map(join(".")) | sort | .[]' "$REF")
          rm -f /tmp/i18n-output.txt
          HAS_ERROR=false

          for FILE in "$MSGS"/*.json; do
            [ -f "$FILE" ] || continue
            [ "$FILE" = "$REF" ] && continue
            FILE_NAME=$(basename "$FILE")
            FILE_KEYS=$(jq -r '[paths(scalars)] | map(join(".")) | sort | .[]' "$FILE")

            MISSING=$(comm -23 <(echo "$REF_KEYS") <(echo "$FILE_KEYS"))
            EXTRA=$(comm -13 <(echo "$REF_KEYS") <(echo "$FILE_KEYS"))

            if [ -n "$MISSING" ]; then
              echo "Keys in en.json missing from $FILE_NAME:" | tee -a /tmp/i18n-output.txt
              echo "$MISSING" | sed 's/^/  - /' | tee -a /tmp/i18n-output.txt
              HAS_ERROR=true
            fi
            if [ -n "$EXTRA" ]; then
              echo "Keys in $FILE_NAME missing from en.json:" | tee -a /tmp/i18n-output.txt
              echo "$EXTRA" | sed 's/^/  - /' | tee -a /tmp/i18n-output.txt
              HAS_ERROR=true
            fi
          done

          if [ "$HAS_ERROR" = true ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "output<<EOF"
              cat /tmp/i18n-output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "All translation files share the same keys."
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment (errors found)
        if: steps.lint.outputs.failed == 'true' || steps.typecheck.outputs.failed == 'true' || steps.i18n.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintFailed = '${{ steps.lint.outputs.failed }}'      === 'true';
            const tcFailed   = '${{ steps.typecheck.outputs.failed }}' === 'true';
            const i18nFailed = '${{ steps.i18n.outputs.failed }}'      === 'true';
            const lintOutput = `${{ steps.lint.outputs.output }}`;
            const tcOutput   = `${{ steps.typecheck.outputs.output }}`;
            const i18nOutput = `${{ steps.i18n.outputs.output }}`;

            const sections = [];
            if (lintFailed) {
              sections.push('### ESLint\n```\n' + lintOutput + '\n```');
            }
            if (tcFailed) {
              sections.push('### TypeScript type-check\n```\n' + tcOutput + '\n```');
            }
            if (i18nFailed) {
              sections.push('### Translation key parity\n```\n' + i18nOutput + '\n```');
            }

            const body = [
              '## ⚠️ Erros de qualidade no frontend',
              '',
              'Este PR introduz erros de **ESLint**, **TypeScript** e/ou **traduções** no frontend.',
              '',
              sections.join('\n\n'),
              '',
              '**Como resolver:**',
              '- ESLint: `cd frontend && npm run lint`',
              '- TypeScript: `cd frontend && npm run type-check`',
              '- Traduções: garantir que todos os ficheiros em `messages/` têm exatamente as mesmas chaves',
              '',
              '_O check passa automaticamente quando os erros forem corrigidos._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const MARKER = 'Erros de qualidade no frontend';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Resolve PR comment (no errors)
        if: steps.lint.outputs.failed == 'false' && steps.typecheck.outputs.failed == 'false' && steps.i18n.outputs.failed == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const MARKER = 'Erros de qualidade no frontend';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: '## ✅ Frontend sem erros\n\nESLint, TypeScript type-check e paridade de traduções passaram. Check resolvido.',
              });
            }

      - name: Fail if errors found
        if: steps.lint.outputs.failed == 'true' || steps.typecheck.outputs.failed == 'true' || steps.i18n.outputs.failed == 'true'
        run: |
          echo "❌ ESLint, TypeScript type-check ou verificação de traduções falharam."
          exit 1

      - name: Pass
        if: steps.lint.outputs.failed == 'false' && steps.typecheck.outputs.failed == 'false' && steps.i18n.outputs.failed == 'false'
        run: echo "✅ ESLint, TypeScript type-check e paridade de traduções passaram."
