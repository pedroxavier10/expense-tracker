name: Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run backend unit tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/pyproject.toml'

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run pytest
        id: pytest
        working-directory: backend
        run: |
          if uv run pytest --tb=short 2>&1 | tee /tmp/pytest-output.txt; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "output<<EOF"
              cat /tmp/pytest-output.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment (tests failed)
        if: steps.pytest.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `${{ steps.pytest.outputs.output }}`;

            const body = [
              '## ⚠️ Testes do backend falharam',
              '',
              'Este PR introduz falhas nos **unit tests do backend**.',
              '',
              '### Saída do pytest',
              '```',
              output,
              '```',
              '',
              '**Como resolver:**',
              '- Corre `cd backend && pytest --tb=short` localmente para reproduzir',
              '- Corrige os testes ou o código e faz push para este PR',
              '',
              '_O check passa automaticamente quando todos os testes passarem._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const MARKER = 'Testes do backend falharam';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Resolve PR comment (tests passed)
        if: steps.pytest.outputs.failed == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const MARKER = 'Testes do backend falharam';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: '## ✅ Testes do backend passaram\n\nTodos os unit tests passaram. Check resolvido.',
              });
            }

      - name: Fail if tests failed
        if: steps.pytest.outputs.failed == 'true'
        run: |
          echo "❌ Unit tests do backend falharam."
          exit 1

      - name: Pass
        if: steps.pytest.outputs.failed == 'false'
        run: echo "✅ Todos os unit tests do backend passaram."
